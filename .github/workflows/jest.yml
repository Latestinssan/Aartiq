name: 🧪 Jest Test Suite

on:
  workflow_dispatch:
    inputs:
      # Dispatching with a pattern runs ONLY the Windows sandbox job, and only
      # that test path — much faster iteration on win-job-runner.ps1. Leave
      # empty (typical push/PR runs) for the full 3-suite Windows matrix.
      windows-test-pattern:
        description: 'Jest test path for the Windows job (e.g. tests/windows-job-sandbox.test.js)'
        required: false
        type: string
      # Dispose the aartiq-browser full-suite job so a dispatch can run just the
      # three OS sandbox runtime jobs (Windows + macOS + Linux). Useful when the
      # generic Ubuntu full suite has unrelated blockers.
      skip-full-suite:
        description: 'Skip the aartiq-browser full-suite job (run only the three OS sandbox runtime jobs)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Node 24.9+ required: several transitive deps (e.g. jsdom -> html-encoding-sniffer
  # -> @exodus/bytes) are ESM-only and jest needs Node >= 24.9 to synchronously
  # require() them in the in-band full suite. Node 22 crashes that load.
  NODE_VERSION: '24'

jobs:
  jest:
    name: Run Jest (aartiq-browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !inputs.windows-test-pattern && !inputs.skip-full-suite }}
    defaults:
      run:
        working-directory: aartiq-browser
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The docs-gate suites (docs-*-match-source, apple-intelligence-genmoji)
      # read the landing site's source from the sibling path
      # ../Aartiq-Landing-Page relative to the workspace — without this clone
      # every one of them fails with ENOENT on the runner.
      - name: Checkout landing page (docs gates read the sibling path)
        run: git clone --depth 1 https://github.com/Latestinssan2/Aartiq-Landing-Page.git "$GITHUB_WORKSPACE/../Aartiq-Landing-Page"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: aartiq-browser/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest
        run: npm test -- --ci --runInBand --forceExit

  # Windows runtime verification for the AppContainer + Job Object sandbox.
  # The macOS/Linux runtime tests skip on Windows, but the runtime matrix in
  # windows-job-sandbox.test.js (suspended AppContainer start, OS-enforced
  # allowlist, verified job assignment, grandchild containment, secret
  # isolation, KILL_ON_JOB_CLOSE) only executes here — on real Windows, with
  # the real win-job-runner.ps1.
  windows-sandbox:
    name: Run Jest (Windows AppContainer sandbox runtime)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: aartiq-browser
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: aartiq-browser/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Windows sandbox tests
        run: |
          $pattern = "${{ inputs.windows-test-pattern }}"
          if ($pattern -eq '') { $pattern = 'tests/sandbox-security.test.js tests/windows-job-sandbox.test.js tests/linux-bwrap-sandbox.test.js' }
          # pwsh passes a scalar string to native exes as ONE argument; split
          # into an array so each test path reaches jest as its own arg.
          $patternArr = @($pattern -split ' ' | Where-Object { $_ -ne '' })
          npx jest $patternArr --ci --runInBand

  # macOS runtime verification. GitHub's macos runners ship /usr/bin/sandbox-exec
  # and python3, so the Seatbelt adversarial suite (file allowlist, IP + AF_UNIX
  # network denial, signal confinement, symlink escapes) runs for real here.
  macos-sandbox:
    name: Run Jest (macOS Seatbelt sandbox runtime)
    runs-on: macos-latest
    if: ${{ !inputs.windows-test-pattern }}
    defaults:
      run:
        working-directory: aartiq-browser
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: aartiq-browser/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run macOS sandbox tests
        run: npx jest tests/sandbox-security.test.js tests/security-fixes.test.js --ci --runInBand

  # Linux runtime verification. GitHub-hosted Ubuntu runners often restrict
  # user namespaces, so these tests may skip at runtime (bwrap capability probe
  # fails closed → runtime blocks skip, fail-closed contract tests still run).
  # Run on a runner where userns is enabled for full enforcement coverage.
  linux-sandbox:
    name: Run Jest (Linux bubblewrap sandbox runtime)
    runs-on: ubuntu-latest
    if: ${{ !inputs.windows-test-pattern }}
    defaults:
      run:
        working-directory: aartiq-browser
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: aartiq-browser/package-lock.json

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Install dependencies
        run: npm ci

      - name: Run Linux sandbox tests
        run: npx jest tests/linux-bwrap-sandbox.test.js tests/sandbox-security.test.js --ci --runInBand
