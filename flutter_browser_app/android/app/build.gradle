plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.aartiq'
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.aartiq"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists() && keystoreProperties.containsKey('storeFile')) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists() && keystoreProperties.containsKey('storeFile')) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
                logger.lifecycle("""
=========================================================================
 WARNING: No android/key.properties found — falling back to the DEBUG
 signing key. This APK will NOT match the GitHub Actions release
 signature, so Google Sign-In (OAuth SHA-1) and Play App uploads will
 fail or behave differently than CI.

 Production fingerprints (must match a Google OAuth client):
   SHA-1   8D:00:42:6B:FE:D6:B0:7F:68:A7:79:E8:A4:3F:92:7A:98:45:6F:B5
   SHA-256 DE:4D:C0:61:3C:56:28:A2:4D:26:96:20:69:20:65:D7:93:38:2B:10:2F:E7:1D:64:2E:6F:1E:ED:22:AA:A5:66
=========================================================================
""")
            }
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }
    lint {
        disable 'InvalidPackage'
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    
    // Import the Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:34.9.0')
    
    // Add the dependencies for Firebase products you want to use
    // When using the BoM, don't specify versions in Firebase dependencies
    implementation 'com.google.firebase:firebase-analytics'

    implementation 'com.google.android.material:material:1.12.0'
    
    def multidex_version = "2.0.1"
    implementation "androidx.multidex:multidex:$multidex_version"
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
